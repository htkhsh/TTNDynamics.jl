# Energies/frequencies: cm^-1; time: fs. Split ket/bra, periodic ring.
[model]
sites = 10
initial_site = 1
hopping_cm = 400.0
frequency_cm = 800.0
damping_cm = 300.0
reorganization_cm = 800.0
temperature_K = 300.0
pade_order = 0
hierarchy_local_size = 5
operator_tolerance = 1e-10

[time]
end_fs = 50.0
observation_fs = 1.0
checkpoint_fs = 10.0

[execution]
output_directory = "output/holstein50_weighted"
seed = 20261105

[comparison]
reference = "reference"
reference_check = "reference_refined"
runs = ["tamen", "augmented", "parallel"]
state_target = 1e-3
density_target = 1e-3

[runs.tamen]
method = "tamen"
dt_fs = 0.5
tolerance = 1e-4
points = 12
sweeps = 10
local_iters = 20
kick_rank = 4
time_error_damp = 100.0
blas_threads = 8

[runs.reference]
extends = "tamen"
dt_fs = 0.25
tolerance = 1e-6
sweeps = 20
local_iters = 40

[runs.reference_refined]
extends = "reference"
dt_fs = 0.125
tolerance = 1e-7
sweeps = 30
local_iters = 60

[runs.augmented]
method = "augmented"
truncation = "weighted"
dt_fs = 0.1
# Absolute truncation budget per step = truncation_rate * dt_fs.
truncation_rate = 1e-5
maxrank = 64
krylov_tolerance = 1e-12
blas_threads = 1

[runs.parallel]
extends = "augmented"
method = "parallel"

[runs.augmented_hhalf]
extends = "augmented"
dt_fs = 0.05

[runs.parallel_hhalf]
extends = "parallel"
dt_fs = 0.05

[runs.augmented_rank]
extends = "augmented"
maxrank = 128

[runs.parallel_rank]
extends = "parallel"
maxrank = 128
